[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshcore-pi-station"
version = "0.3.0"
description = "Raspberry Pi web companion for a MeshCore USB radio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "meshcore>=2.3.9.1,<3",
  "segno>=1.6,<2",
  "cryptography>=45,<47",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
meshcore-pi-station = "meshcore_station.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcore_station"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
